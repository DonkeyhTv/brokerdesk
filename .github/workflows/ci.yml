name: CI

on: push

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: brokerdesk_test
          POSTGRES_USER: brokerdesk
          POSTGRES_PASSWORD: brokerdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brokerdesk -d brokerdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: brokerdesk
      DB_PASSWORD: brokerdesk
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer format
      - run: composer analyse
      - run: composer test

  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/broker/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for every service to reach the API
        run: |
          for url in \
            http://localhost:8000/api/v1/health \
            http://localhost:5173/api/v1/health \
            http://localhost:3000/; do
            timeout 300 sh -c "until curl -fs $url; do sleep 5; done"
            echo " <- $url"
          done
      - name: Run the browser tests
        run: docker compose --profile e2e run --rm e2e
      - name: Check the formatting of the browser tests
        working-directory: e2e
        run: npx --yes prettier@3.9.10 --check tests playwright.config.ts
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 50
