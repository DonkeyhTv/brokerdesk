x-api: &api
  build: ./apps/api
  # Same user everywhere, including "docker compose exec", so that files stay readable by php-fpm.
  user: www-data
  environment:
    COMPOSER_HOME: /tmp/composer
  volumes:
    - ./apps/api:/app
    - api_vendor:/app/vendor

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brokerdesk
      POSTGRES_USER: brokerdesk
      POSTGRES_PASSWORD: brokerdesk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./apps/api/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerdesk -d brokerdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  setup:
    <<: *api
    user: root
    command: api-setup
    depends_on:
      db:
        condition: service_healthy

  php:
    <<: *api
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *api
    command: php artisan queue:work --tries=3
    depends_on:
      setup:
        condition: service_completed_successfully

  scheduler:
    <<: *api
    command: php artisan schedule:work
    depends_on:
      setup:
        condition: service_completed_successfully

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - ./apps/api/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/app/public:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  broker:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://nginx
      VITE_USE_POLLING: "true"
    depends_on:
      - nginx
    ports:
      - "5173:5173"
    volumes:
      - ./apps/broker:/app
      - broker_node_modules:/app/node_modules

  portal:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://nginx
      WATCHPACK_POLLING: "true"
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    volumes:
      - ./apps/portal:/app
      - portal_node_modules:/app/node_modules
      - portal_next:/app/.next

volumes:
  db_data:
  api_vendor:
  broker_node_modules:
  portal_node_modules:
  portal_next:
