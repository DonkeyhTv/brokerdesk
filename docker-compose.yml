services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brokerdesk
      POSTGRES_USER: brokerdesk
      POSTGRES_PASSWORD: brokerdesk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerdesk -d brokerdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - api_vendor:/app/vendor

  broker:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/broker:/app
      - broker_node_modules:/app/node_modules

  portal:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/portal:/app
      - portal_node_modules:/app/node_modules
      - portal_next:/app/.next

volumes:
  db_data:
  api_vendor:
  broker_node_modules:
  portal_node_modules:
  portal_next:
